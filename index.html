<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252a27">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ibory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d8dbd2; --panel:#eceee7; --panel2:#e0e3d9; --ink:#20261f; --muted:#596156;
  --brass:#86661b; --brass-soft:rgba(160,120,30,.14); --red:#9e2f38; --grass:#56703d;
  --grass-soft:rgba(86,112,61,.14); --line:#b4b9aa; --stone:#8d928a;
  --t-common:#7d837a; --t-rare:#3d6aa3; --t-epic:#77489e; --t-legendary:#b8902f; --t-historic:#a3262f; --t-mythic:#138a99;
  --display:"Cinzel", "Trajan Pro", Georgia, serif;
  --body:"Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#252a27; --panel:#313834; --panel2:#3a423d; --ink:#ebe3d0; --muted:#a8ad9e;
    --brass:#d7b058; --brass-soft:rgba(215,176,88,.13); --red:#d4575f; --grass:#86a364;
    --grass-soft:rgba(134,163,100,.14); --line:#4b5550; --stone:#646b65;
    --t-common:#6f766f; --t-rare:#4f7fbd; --t-epic:#8e5fb8; --t-legendary:#d7b058; --t-historic:#c8414b; --t-mythic:#2cc0d1;
  }
}
:root[data-theme="dark"]{
  --bg:#252a27; --panel:#313834; --panel2:#3a423d; --ink:#ebe3d0; --muted:#a8ad9e;
  --brass:#d7b058; --brass-soft:rgba(215,176,88,.13); --red:#d4575f; --grass:#86a364;
  --grass-soft:rgba(134,163,100,.14); --line:#4b5550; --stone:#646b65;
  --t-common:#6f766f; --t-rare:#4f7fbd; --t-epic:#8e5fb8; --t-legendary:#d7b058; --t-historic:#c8414b; --t-mythic:#2cc0d1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 12px}
h1{font:700 1.5rem/1.1 var(--display);letter-spacing:.04em;margin:0}
.lordline{font-size:.9rem;color:var(--muted);margin-top:2px}
.lordline b{color:var(--brass);font-weight:700}
.speedchip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:.95rem}
.speedchip b{color:var(--brass)}
.speedchip b:empty{display:none}
header{flex-wrap:wrap}
.chiprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.ledger{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res{background:var(--panel);padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.res .ico{width:20px;height:20px;color:var(--brass)}
.res b{font-size:1.02rem;font-weight:700;line-height:1.2}
.res small{font-size:.76rem;color:var(--muted)}
.res small.neg{color:var(--red)}
.popline{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:var(--muted);padding:8px 4px 0;flex-wrap:wrap}
.popline b{color:var(--ink);font-weight:500}

.queue{margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.queue[open]{display:grid;gap:8px}
.queue summary,.det summary{cursor:pointer;color:var(--ink);list-style:none}
.queue summary::-webkit-details-marker,.det summary::-webkit-details-marker{display:none}
.queue summary::before,.det summary::before{content:"\25b8";color:var(--brass);display:inline-block;width:1em;transition:transform .15s}
.queue[open] summary::before,.det[open] summary::before{transform:rotate(90deg)}
.det>summary{margin:-2px 0}
.qrow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center}
.qrow.idle{color:var(--muted);font-size:.93rem;display:block}
.qlabel{font-weight:500}
.qtime{font-weight:700;color:var(--brass)}
.qstack{display:grid;gap:8px}
@media (max-width:560px){ table.gt{min-width:0;font-size:.82rem} table.gt th,table.gt td{padding:4px 5px;white-space:normal} table.gt th:first-child,table.gt td:first-child{overflow-wrap:anywhere} }
.simbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.simbtns .btn{padding:7px 4px;font-size:.84rem;line-height:1.15}
table.simtab{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:8px;font-size:.9rem}
table.simtab th,table.simtab td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.simtab th:first-child,table.simtab td:first-child{text-align:left;overflow-wrap:anywhere;padding-left:2px}
table.simtab th{font:700 .78rem var(--display);color:var(--muted)}
table.simtab tr.sub td{color:var(--muted);font:700 .76rem var(--display);padding-top:10px;border-bottom:0;text-align:left}
table.simtab input{width:100%;min-width:0;padding:5px 6px;text-align:right;font-size:.92rem}
#marchstrip:empty{display:none}
.mstrip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px}
.mstrip summary{cursor:pointer;color:var(--ink)}
.mlist{display:grid;gap:4px;margin-top:6px}
#qbadge{color:var(--brass);margin-left:2px}
.repbar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;margin-top:6px}
.repbar i{display:block;height:100%;background:linear-gradient(90deg,#3f8f5a,var(--brass))}
.bullybox{box-shadow:inset 3px 0 0 #b8322a}
.threat.ally{border-color:#3f8f5a}
.mbtns{display:flex;gap:14px;justify-content:flex-end;margin:-2px 0 4px}
.bq .mbtns{grid-column:1/-1;justify-content:flex-start;margin:0}
.mrowl{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-left:3px solid var(--line);padding-left:8px}
.mrowl span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrowl.out{border-color:#e05a4f} .mrowl.back{border-color:var(--brass)} .mrowl.friend{border-color:#5fa36a}
.arrbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;min-height:34px}
.arrbar.on{background:var(--brass-soft);border-radius:8px;padding:6px 10px}
.arranging .plot:not(.locked){animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
@media (prefers-reduced-motion: reduce){ .arranging .plot{animation:none} }
body{overflow-x:hidden}
h1{overflow-wrap:anywhere}
.pagehead{margin-bottom:10px}
.pagelabel{font:700 .95rem var(--display);color:var(--muted);margin:16px 2px 8px}
.bpage{display:grid;gap:10px}
.bpage .head{display:flex;gap:12px;align-items:center}
.bpage .head .ico{width:40px;height:40px;color:var(--brass);flex:none}
.bpage h2{margin:0;font:700 1.25rem/1.15 var(--display)}
.bpage .sub{color:var(--muted);font-size:.92rem}
.bpage p{margin:0}
.bpage .effect{background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:.95rem}
.statcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.statcards div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center;display:grid;gap:1px;min-width:0}
.statcards b{font:700 1.05rem var(--display);color:var(--brass);overflow-wrap:anywhere}
.statcards span{font-size:.78rem;color:var(--muted)}
details.rep summary{list-style-position:outside;line-height:1.35}
.section,.unit,.tech,.hero,.offer{min-width:0}
#threats{display:grid;gap:6px;margin-bottom:8px}
#threats:empty{display:none}
.threat{display:grid;gap:2px;text-align:left;border:1px solid var(--red);background:rgba(200,60,60,.12);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.threat b{color:var(--red)}
.gaterow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel2);border-radius:8px;padding:8px 12px;margin:6px 0 8px}
.gaterow.shut{box-shadow:inset 3px 0 0 var(--red)}
.taunt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.farmadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.farmgrid{display:grid;grid-template-columns:repeat(5,auto);gap:6px}
@media (min-width:520px){ .farmgrid{grid-template-columns:repeat(10,auto)} }
.chipbtn{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:700 .9rem var(--display)}
.chipbtn.on{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.chipbtn:disabled{opacity:.4;cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:center;font-size:.93rem}
.qlist{margin:6px 0 0;padding-left:22px;display:grid;gap:4px}
.qlist li span.dur{margin-left:6px}
.qlist li > button{float:right;margin-left:10px}
.bar{grid-column:1/-1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0}
.qacts{grid-column:1/-1;display:flex;gap:16px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:2px 0;font-size:.88rem}
.link.strong{color:var(--brass);font-weight:700}

.tabbar{position:relative;margin:16px 0 12px}
.tabarrow{position:absolute;top:0;bottom:1px;width:34px;border:0;z-index:2;cursor:pointer;font:700 1.4rem/1 var(--display);color:var(--brass);padding:0}
.tabarrow.left{left:0;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.tabarrow.right{right:0;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.tabarrow[hidden]{display:none}
.citybar{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:thin}
.citybar:empty{display:none}
.citybar button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;cursor:pointer;font:500 .92rem var(--display)}
.citybar button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
nav.tabs{display:flex;gap:2px;margin:0;scroll-behavior:smooth;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 11px 10px;cursor:pointer;color:var(--muted);font:500 1rem var(--display);letter-spacing:.03em;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}

/* The walled city */
.walls{position:relative;padding:14px;border-radius:6px;background:var(--stone);box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);margin-top:8px}
.walls::before{content:"";position:absolute;left:10px;right:10px;top:-8px;height:8px;
  background:repeating-linear-gradient(90deg,var(--stone) 0 14px,transparent 14px 24px)}
.walls[data-w]{cursor:pointer}
.walls.busy{box-shadow:inset 0 0 0 3px var(--brass)}
.walltag{position:absolute;top:-2px;right:14px;font:700 .72rem var(--display);color:#fff;background:rgba(0,0,0,.35);padding:1px 8px;border-radius:0 0 6px 6px;z-index:1}
.gate{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:44px;height:16px;background:var(--bg);border-radius:22px 22px 0 0}
.citymap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);padding:10px;border-radius:3px}
.plot{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;min-width:0;position:relative}
.plot:hover{border-color:var(--brass)}
.plot .ico{width:30px;height:30px;color:var(--ink)}
.plot .nm{font-size:.8rem;line-height:1.15;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.plot .lv{position:absolute;top:5px;right:6px;font:700 .78rem var(--display);color:var(--brass)}
.plot.empty{background:transparent;border-style:dashed;color:var(--muted)}
.plot.empty .ico{color:var(--muted);width:22px;height:22px}
.plot.busy{border-color:var(--brass);background:var(--brass-soft)}
.plot.th{grid-column:2/4;grid-row:2/4;aspect-ratio:auto;background:var(--panel2)}
.plot.th .ico{width:54px;height:54px;color:var(--brass)}
.plot.th .nm{font:700 .98rem var(--display)}
.plot.th .lv{font-size:.9rem;top:8px;right:10px}
.fieldmap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fieldmap .plot{background:var(--grass-soft);border-color:transparent}
.fieldmap .plot .ico{color:var(--grass)}
.fieldmap .plot.empty{background:transparent;border-color:var(--line)}
.fieldmap .plot.busy{background:var(--brass-soft);border-color:var(--brass)}
.plot.locked{cursor:default;opacity:.45;border-style:dotted;background:transparent}
.plot.locked:hover{border-color:var(--line)}
@media (min-width:560px){ .fieldmap{grid-template-columns:repeat(6,1fr)} }

.section{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.section:first-child{margin-top:0}
.section h3,.h3{margin:0 0 4px;font:700 1rem var(--display);letter-spacing:.03em}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.9rem;margin:2px 0 0}
.taxrow{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px}
.taxrow .btn{min-width:48px;font-size:1.2rem}
.taxrow .taxval{font:700 1.5rem var(--display);min-width:3.2em;text-align:center}
.taxrow input{flex:1;accent-color:var(--brass)}
.taxrow b{min-width:3.2em;text-align:right}
.note{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.warn{color:var(--red);font-size:.92rem;margin:6px 0 0}

.techlist{display:grid;gap:10px}
.tech{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.tech .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tech h3{margin:0;font:700 1rem var(--display)}
.tech .tl{font:700 .9rem var(--display);color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;padding:2px 8px 2px 5px;border-radius:999px;background:var(--panel2)}
.chip svg{width:15px;height:15px;color:var(--brass)}
.chip.short{color:var(--red);background:transparent;box-shadow:inset 0 0 0 1px var(--red)}
.chip.short svg{color:var(--red)}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:9px 16px;background:var(--brass);color:var(--bg);font-weight:700;cursor:pointer}
.btn:disabled{background:var(--panel2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:6px 12px;font-size:.92rem}
.why{font-size:.88rem;color:var(--red)}
.dur{font-size:.9rem;color:var(--muted)}

.empty-state{text-align:center;padding:26px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.empty-state p{margin:0 0 12px}

.market{display:grid;gap:12px}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.mrow label{color:var(--muted);font-size:.92rem}
select,input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.9rem}
.mresult{font-size:1.05rem}
.mresult b{color:var(--brass)}

/* Heroes */
.herolist{display:grid;gap:8px;margin-top:10px}
.hero{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:9px 12px;cursor:pointer;width:100%}
.hero:hover{border-color:var(--brass)}
.hero .shield{grid-row:1/3}
.hero .hn{font:700 1rem/1.2 var(--display)}
.hero .hs{font-size:.88rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.hero .hs b{color:var(--ink);font-weight:700}
.hero .hr{grid-row:1/3;grid-column:3;text-align:right;display:grid;gap:2px;justify-items:end}
.tier{font-size:.8rem;font-weight:700}
.badge{font-size:.76rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--brass);color:var(--bg)}
.xpbar{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;width:70px}
.xpbar i{display:block;height:100%;background:var(--brass)}
.offer{display:grid;grid-template-columns:42px 1fr auto;gap:2px 12px;align-items:center;background:var(--panel2);border-radius:10px;padding:9px 12px}
.offer .shield{grid-row:1/3}
.offer .btn{grid-row:1/3;grid-column:3}
.gearslots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gslot{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 4px;cursor:pointer;display:grid;gap:1px;justify-items:center;min-height:62px;font-size:.78rem}
.gslot .gs-n{color:var(--muted)} .gslot .gs-e{color:var(--muted);font-style:italic}
.gslot .gs-s,.gearrow .gst{color:var(--brass);letter-spacing:1px}
.gslot .gs-b{font-weight:700}
.gslot.t4,.gearrow.t4{border-color:var(--t-mythic);box-shadow:inset 0 0 0 1px var(--t-mythic),0 0 8px rgba(44,192,209,.35)}
.gslot.t1,.gearrow.t1{border-color:var(--t-rare)} .gslot.t2,.gearrow.t2{border-color:var(--t-epic)} .gslot.t3,.gearrow.t3{border-color:var(--t-legendary);box-shadow:inset 0 0 0 1px var(--t-legendary)}
.gearlist{display:grid;gap:6px;margin-top:8px}
.gearrow{display:grid;grid-template-columns:1fr auto;gap:0 10px;text-align:left;border:1px solid var(--line);border-left-width:4px;background:var(--panel2);border-radius:8px;padding:7px 10px;cursor:pointer}
.gearrow .gn{font:700 .95rem var(--display)} .gearrow .gb{font-weight:700;text-align:right}
@media (max-width:420px){ .gearslots{grid-template-columns:repeat(2,1fr)} }
.statgrid{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center}
.statgrid .sv{font:700 1.1rem var(--display);min-width:2.2em;text-align:right}
.plus{width:32px;height:32px;border-radius:8px;border:1px solid var(--brass);background:none;color:var(--brass);font-weight:700;cursor:pointer}
.ptbtns{display:flex;gap:4px;align-items:center} .plus.all{width:auto;padding:0 8px;font-size:.78rem}
.plus:disabled{opacity:.35;cursor:default}
.plus:disabled{border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* Wheel */
.wheelbox{display:grid;justify-items:center;gap:14px;padding:6px 0 4px}
.wheelwrap{position:relative;width:min(100%,360px);aspect-ratio:1}
.wheelwrap svg.wheel{width:100%;height:100%;transform-origin:50% 50%;will-change:transform}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:28px;height:34px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.spinrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.spinrow .btn{min-width:130px;font-family:var(--display);letter-spacing:.04em;font-size:1.05rem;padding:11px 18px}
.prize{min-height:2.8em;text-align:center;font-size:1.05rem}
.prize b{font-family:var(--display)}
.prize .big{display:block;font:700 1.3rem var(--display);color:var(--brass)}
details{margin-top:4px}
summary{cursor:pointer;color:var(--muted);font-size:.92rem}
.odds{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:.9rem;margin-top:8px}
.odds span:nth-child(even){text-align:right;color:var(--muted)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.invitem{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:7px 10px;font-size:.92rem}
.invitem svg{width:20px;height:20px;color:var(--brass);flex:none}
.gt td.pri{white-space:nowrap}
.lvguide{display:grid;gap:4px;margin-top:6px}
.lvrow{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:.9rem;line-height:1.4}
.lvrow>b{color:var(--brass)}
.lvrow.cur{box-shadow:inset 0 0 0 1px var(--brass)}
.lvdet{margin-top:10px}
.lvdet>summary{padding:4px 0}
.reqt tr.ok td:first-child{color:#3f8f5a;font-weight:600}
.reqt td .why{color:var(--red)}
body.bfmode #tabs, body.bfmode .tabarrow, body.bfmode .queue, body.bfmode #marchstrip, body.bfmode #threats{display:none!important}
.achlist{display:grid;gap:8px;margin-top:8px}
.achrow{display:grid;grid-template-columns:24px 1fr auto;gap:3px 10px;align-items:center;background:var(--panel2);border-radius:10px;padding:9px 12px}
.achrow>svg{width:22px;height:22px;color:var(--muted);grid-row:1/3}
.achrow.on>svg{color:var(--brass)}
.achrow .ad{grid-column:1/-1}
.achrow .ab{text-align:right;font-size:.86rem;color:var(--muted)}
.achrow .ab b{color:var(--brass)}
.atier{color:var(--brass);font-weight:700}
.gt td.pri .link{padding:2px 5px;font-size:1rem}
.irow{display:grid;grid-template-columns:24px 1fr auto;gap:2px 12px;align-items:center;background:var(--panel2);border-radius:10px;padding:9px 12px}
.irow>svg{width:22px;height:22px;color:var(--brass);grid-row:1/3}
.irow .n{font-weight:700;font-size:1.05rem;text-align:right}
.irow .d{grid-column:2/4}
.irow .ia{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ilist{display:grid;gap:8px;margin-top:8px}
.pkgcard{background:var(--panel2);border-radius:10px;padding:10px 12px;display:grid;gap:5px}
.pkgcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pkgcard.done{opacity:.6}
.inote{background:var(--panel2);border-left:3px solid var(--brass);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.92rem}
.invitem b{margin-left:auto}
.amu{display:flex;flex-direction:column;align-items:center;gap:0}
.amuct{display:flex;align-items:center;gap:6px;font-size:1.05rem}
.amuct svg{width:22px;height:22px;color:var(--brass)}
.amuct b{font:700 1.3rem var(--display);color:var(--brass)}
.pity{width:min(100%,300px);display:grid;gap:4px;justify-items:center}
.pitybar{width:100%;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.pitybar i{display:block;height:100%;background:var(--t-legendary)}
.log{margin:8px 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--muted);display:grid;gap:2px}

/* Army + war room */
.tscroll{overflow-x:auto;margin-top:8px}
table.gt{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
table.gt th,table.gt td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.gt th:first-child,table.gt td:first-child{text-align:left}
table.gt th{font:700 .82rem var(--display);color:var(--muted);letter-spacing:.02em}
table.gt input{width:88px;padding:5px 7px;text-align:right}
table.gt tr.sub td{color:var(--muted);font-size:.82rem;padding-top:12px;border-bottom:0;font-family:var(--display)}
table.gt td.loss{color:var(--red);font-weight:700}
table.gt td.ok{color:var(--grass);font-weight:700}
.unit{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--panel2);border-radius:10px;padding:10px 12px}
.unit.locked{opacity:.72}
.unit h4{margin:0;font:700 1rem var(--display)}
.unit .us{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;grid-column:1/-1}
.unit .us b{color:var(--ink)}
.unit .own{font:700 1rem var(--display);color:var(--brass);text-align:right}
.trainrow{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trainrow input{width:110px}
.reqs{grid-column:1/-1;font-size:.86rem;color:var(--red)}
.unitlist{display:grid;gap:8px;margin-top:10px}
.bq{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 12px;margin-top:6px}
.bq .bar{grid-column:1/-1}
.verdict{font:700 1.3rem var(--display)}
.verdict.win{color:var(--grass)} .verdict.lose{color:var(--red)}
.blog{max-height:320px;overflow:auto;font-size:.86rem;margin:8px 0 0;padding:0;list-style:none;display:grid;gap:1px}
.blog li{padding:2px 0;border-bottom:1px dotted var(--line)}
.blog li b{font-family:var(--display);color:var(--brass);margin-right:6px}
.simrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.simrow select{width:auto}
.techgroup{margin:14px 0 6px;font:700 .95rem var(--display);color:var(--muted)}
.techgroup:first-child{margin-top:0}
.tech .req{font-size:.86rem;color:var(--red)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.medal{background:var(--panel2);border-radius:10px;padding:8px 6px;text-align:center;display:grid;gap:2px;justify-items:center}
.medal svg{width:26px;height:26px}
.medal span{font-size:.82rem;color:var(--muted)}
.medal b{font:700 1.05rem var(--display)}
.checks{list-style:none;margin:8px 0;padding:0;display:grid;gap:3px;font-size:.93rem}
.checks li::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:8px;background:var(--red);vertical-align:1px}
.checks li.met::before{background:var(--grass)}
.checks li.met{color:var(--muted)}
.ladder{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;font-size:.9rem;margin-top:8px}
.ladder .cur{color:var(--brass);font-weight:700}
.bigstat{font:700 1.6rem var(--display);color:var(--brass)}
.maptools{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.maptools .btn{min-width:40px}
.mapview{touch-action:none;overscroll-behavior:contain;margin-top:8px;border-radius:8px;border:1px solid var(--line);overflow:hidden;height:min(58vh,520px);contain:strict}
@supports (height:1svh){ .mapview{height:min(58svh,520px)} }
.mapview canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapbottom{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:10px;align-items:start}
#minic{width:132px;height:132px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.finder{display:grid;gap:6px}
.finder select{width:100%}
@media (min-width:560px){ #minic{width:198px;height:198px} }
.mapwrap{overflow:auto;max-height:62vh;border-radius:8px;border:1px solid var(--line);margin-top:8px;-webkit-overflow-scrolling:touch;background:var(--panel2)}
.mapwrap canvas{display:block;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.okc{color:var(--grass)} .badc{color:var(--red)}
details.rep{border-top:1px solid var(--line);padding:6px 0}
.reprow{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 2px;color:var(--ink);font:inherit;font-size:.93rem;line-height:1.35;cursor:pointer}
.reprow:hover{background:var(--panel2)} .reprow .chev{float:right;color:var(--muted)}
.kills{margin-top:8px;display:grid;gap:4px;font-size:.88rem} .killrow{line-height:1.4}
.killdet summary{cursor:pointer;color:var(--brass);font-size:.88rem}
details.rep summary{color:var(--ink);font-size:.93rem}
dialog{border:0;padding:0;background:transparent;color:var(--ink);max-width:560px;width:calc(100% - 20px);margin:auto auto 10px;max-height:85vh}
dialog::backdrop{background:rgba(10,12,10,.5)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;overflow:auto;max-height:85vh}
.sheet .head{display:flex;gap:12px;align-items:center}
.sheet .head .ico{width:40px;height:40px;color:var(--brass);flex:none}
.sheet h2{margin:0;font:700 1.25rem/1.15 var(--display)}
.sheet .sub{color:var(--muted);font-size:.92rem}
.sheet p{margin:0}
.effect{background:var(--panel2);border-radius:8px;padding:8px 12px;font-size:.95rem}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--brass)}
.choice:disabled{opacity:.55;cursor:not-allowed}
.choice .ico{width:30px;height:30px;color:var(--brass);grid-row:1/4}
.choice b{font-family:var(--display)}
.choice .d{font-size:.88rem;color:var(--muted)}
.closebtn{justify-self:end;border:0;background:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.speeds{display:flex;gap:8px;flex-wrap:wrap}
.speeds button{flex:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px;cursor:pointer;font-weight:700;min-width:70px}
.speeds button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.danger{color:var(--red)}
textarea{font:.8rem/1.3 ui-monospace,Menlo,monospace;width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);resize:vertical}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:calc(100% - 28px);font-weight:500;
  transition:opacity .25s, transform .25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
@media (max-width:420px){
  .res b{font-size:.92rem} .res small{font-size:.7rem}
  nav.tabs button{padding:9px 8px 10px;font-size:.92rem}
  .plot .nm{font-size:.72rem}
}
</style>

<body>
<div class="wrap">
  <header>
    <div><h1 id="cityname">Stonewatch</h1><div class="lordline" id="lordline"></div></div>

    <button class="speedchip" data-act="quests" aria-label="Quests">Quests<b id="qbadge"></b></button>
    <button class="speedchip" data-act="settings" id="speedtag" style="display:none;color:var(--red)" aria-label="Testing speed is on"></button>

    <button class="speedchip" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
    </div>

</div>

// Respec: every point a hero has been given above its starting stats goes back into the pool to be spent again.

  keys.slice().sort(function(a,c){ return (room[c]-take[c])-(room[a]-take[a]); }).forEach(function(k){ if (used<owed && take[k]<room[k]){ take[k]++; used++; } });

function marchLine(m){

function wireDetails(root){

    if (d.dataset.wired) return; d.dataset.wired="1";

function queueSummary(){
  var a=document.getElementById("q-sum"), b=document.getElementById("q-sum2"); if (!a) return;
  var n=S.builds.length, soon=Infinity;
  S.builds.forEach(function(x){ soon=Math.min(soon,x.end); });
  if (S.research) soon=Math.min(soon, S.research.end);
  if (S.fortQ) soon=Math.min(soon, S.fortQ.end);
  var jobs=n+(S.research?1:0)+(S.fortQ?1:0);
  var lead = jobs ? jobs+" job"+(jobs>1?"s":"")+" running" : (BUILDERS-n)+" builder"+(BUILDERS-n>1?"s":"")+" free";
  var tail = jobs ? "next in "+fmtT(realMs(soon-S.gt)) : (S.bq.length? S.bq.length+" queued" : "tap a plot to build");
  if (!jobs && S.bq.length) lead="Builders free";
  setText(a, lead); setText(b, tail);
}

var tab = "city";
function plotHtml(w,i,s){
  var busy = !!buildOn(w,i), picked = arrange && arrange.w===w && arrange.sel===i;
  if (picked) busy=true;
  if (!s) return '<button class="plot empty" data-w="'+w+'" data-i="'+i+'" aria-label="Empty plot"><span class="ico">'+ICON.plus+'</span><span class="nm">Empty</span></button>';
  var lv = s.level>0 ? '<span class="lv">'+s.level+'</span>' : '';
  var nm = s.level>0 ? DEF[s.type].name : "Building…";
  return '<button class="plot'+(busy?' busy':'')+'" data-w="'+w+'" data-i="'+i+'" aria-label="'+DEF[s.type].name+' level '+s.level+'"><span class="ico">'+ICON[s.type]+'</span><span class="nm">'+nm+'</span>'+lv+'</button>';
}
var arrange=null;
function arrangeBar(w){
  var on=arrange && arrange.w===w;
  return '<div class="arrbar'+(on?' on':'')+'"><span class="dur">'+(on?(arrange.sel==null?'Tap a building to pick it up.':'Now tap where it should go. Tapping another building swaps them.'):'')+'</span><button class="btn '+(on?'':'ghost ')+'small" data-act="arrange" data-aw="'+w+'">'+(on?'Done':'Rearrange')+'</button></div>';
}
function swapPlots(w,a,b){
  var arr = w==="in" ? S.inside : S.fields, t=arr[a]; arr[a]=arr[b]; arr[b]=t;
  var sw=function(x){ return x===a?b:x===b?a:x; };
  S.builds.forEach(function(bd){ if (bd.where===w) bd.idx=sw(bd.idx); });
  S.bq.forEach(function(it){ if (it.w===w) it.i=sw(it.i); });
  if (w==="in") S.train.forEach(function(tr){ tr.slot=sw(tr.slot); });
  if (pg && pg.w===w) pg.i=sw(pg.i);
}
function viewCity(){
  var thBusy = !!buildOn("th",0);
  var wBusy = !!buildOn("wall",0);
  var h=arrangeBar("in")+'<div class="walls'+(wBusy?' busy':'')+(arrange&&arrange.w==="in"?' arranging':'')+'" data-w="wall" data-i="0" title="Walls level '+(S.wall||0)+'"><span class="walltag">Walls '+(S.wall||0)+'</span><div class="citymap">';
  h+='<button class="plot th'+(thBusy?' busy':'')+'" data-w="th" data-i="0" aria-label="Town Hall level '+S.th+'"><span class="ico">'+ICON.townhall+'</span><span class="nm">Town Hall</span><span class="lv">'+S.th+'</span></button>';
  S.inside.forEach(function(s,i){ h+=plotHtml("in",i,s); });
  h+='</div><div class="gate"></div></div>';
  if (S.bq.length){
    h+='<div class="section"><h3>Build queue</h3><p class="hint">Starts on its own when a builder is free and the cost is covered, even while you\u2019re away.</p><ol class="qlist">'+S.bq.map(function(it,k){
      var sl=getSlot(it.w,it.i), L=sl?sl.level:0, st=bqState(it);
      return '<li><span>'+DEF[it.type].name+(sl?' to level '+(L+1):' (new)')+' <span class="dur">'+(st==="wait"?(buildOn(it.w,it.i)?"after current work":"waiting"):"ready")+'</span></span><button class="link" data-act="bq-remove" data-k="'+k+'">Remove</button></li>'; }).join("")+'</ol></div>';

function fieldsSection(){

    viewFields()+'</details>';
}

function viewAcademy(){
  var al=academyLv();
  if (!al) return '<div class="empty-state"><p>Build an Academy on an empty city plot to start researching.</p><button class="btn" data-act="tab" data-tab="city">Go to city</button></div>';
  var elseRes={}; S.cities.forEach(function(c){ if (c!==C() && c.research) elseRes[c.research.tech]=c.name; });
  var h='<p class="note">Academy level '+al+'. Research is shared by every city you rule, but a city only enjoys a level its own Academy can support, so '+esc(S.name)+' uses levels up to '+al+'. Every city with an Academy can research at once, as long as they work on different techs.</p>', lastG="";
  if (S.rq.length) h+='<div class="section" style="margin:0 0 12px"><h3>Research queue</h3><ol class="qlist">'+S.rq.map(function(k,i){ return '<li><span>'+TECH[k].name+'</span><button class="link" data-act="rq-remove" data-k="'+i+'">Remove</button></li>'; }).join("")+'</ol></div>';
  var openG=false;
  Object.keys(TECH).forEach(function(k){
    var L=S.tech[k], G=S.techG[k]||0, to=G+1, t=TECH[k], why="", miss=[]; // research raises the realm's level; this city enjoys up to its Academy
    if (t.g!==lastG){ if (openG) h+='</div></details>'; var gk="tg_"+t.g.replace(/\W/g,""); h+='<details class="det techdet" data-det="'+gk+'"'+(DET[gk]===false?'':' open')+'><summary class="techgroup">'+t.g+'</summary><div class="techlist">'; openG=true; lastG=t.g; }
    var tmx=techMax();
    if (G<tmx) miss=missing(techReqs(k,to));
    if (G>=tmx) why="Max level";
    else if (S.research && S.research.tech===k) why="Researching now";
    else if (miss.length) why="";
    else if (S.research) why="Academy is busy";
    else if (elseRes[k]) why=esc(elseRes[k])+" is researching this";
    else if (!afford(techCost(k,to))) why="Not enough resources";
    var blocked = why || miss.length;
    h+='<div class="tech"><div class="top"><h3>'+t.name+'</h3><span class="tl">Lv '+L+(G>L?' <span class="dur">(realm '+G+')</span>':'')+'</span></div><span class="dur">'+t.desc+'</span>';

  var free=FRIENDS.filter(function(f){ return !rosterHasFriend(f.k); });
  if (!free.length) return null;
  var sum=free.reduce(function(a,f){ return a+f.pick; },0), r=Math.random()*sum;

}

function questState(q){ var cl=S.qdone&&S.qdone[q.id]; return cl ? "claimed" : q.check() ? "ready" : "open"; }
function questsReady(){ var n=0; questCats().forEach(function(c){ var q=nextQuest(c); if (q && questState(q)==="ready") n++; }); return n; }
function questCats(){ var seen={}, out=[]; QUESTS.forEach(function(q){ if (!seen[q.cat]){ seen[q.cat]=1; out.push(q.cat); } }); return out; }
function nextQuest(cat){ for (var i=0;i<QUESTS.length;i++){ var q=QUESTS[i]; if (q.cat===cat && !(S.qdone&&S.qdone[q.id])) return q; } return null; }
function rewardText(rw){ var p=[]; if (rw.res) RES.forEach(function(k){ if (rw.res[k]) p.push(fmt(rw.res[k])+" "+RNAME[k].toLowerCase()); });
  if (rw.items) for (var k in rw.items) p.push(rw.items[k]+" "+ITEMS[k].name); if (rw.medals) for (var m in rw.medals) p.push(rw.medals[m]+" "+MEDALS.filter(function(x){ return x[0]===m; })[0][1]+" medal"+(rw.medals[m]>1?"s":"")); return p.join(", "); }

function claimQuest(id){
  var q=QUESTS.filter(function(x){ return x.id===id; })[0]; if (!q || questState(q)!=="ready") return;

var LOG_CAP=5000, FULL_CAP=300, repFilter="all", repPage=0, repQuery="";

function compactRep(r){
  var killed=0, lootT=RES.reduce(function(a,k){ return a+((r.loot&&r.loot[k])||0); },0); for (var i=0;i<12;i++) killed+=(r.had[i]||0)-(r.eleft[i]||0);
  return {id:r.id, at:r.at, sc:r.scout?1:0, n:(r.scout?"Scouted ":"")+r.name+(r.gate?" (gates shut)":""), tile:r.tile, r:r.result, d:r.def?1:0, l:r.lost||0, k:killed, lo:lootT, m:r.medal==null?-1:r.medal, g:(r.drops||[]).slice(), h:r.historic||null, f:r.founded||null, o:r.occupied?1:0, c:C().name};
}
function bumpStats(c){
  if (c.sc) return;
  var st=S.stats;
  if (c.d){ st.defs++; if (c.r!==1) st.held++; } else { st.atk++; if (c.r===1){ st.win++; if (!c.l) st.flaw++; } }
  st.lostT+=c.l; st.killT+=c.k; if (!c.d) st.loot+=c.lo; if (c.m>=0) st.medals++; st.gear+=c.g.filter(isGearDrop).length;
}
function addReport(rep){
  if (pendingWound && !rep.scout){ rep.wounded=(rep.wounded||0)+pendingWound; } pendingWound=0;
  S.reports.unshift(rep); if (S.reports.length>FULL_CAP) S.reports.length=FULL_CAP;
  var c=compactRep(rep); S.log.unshift(c); if (S.log.length>LOG_CAP) S.log.length=LOG_CAP; bumpStats(c);
}
function gameClock(t){ var d=Math.floor(t/86400000)+1, m=Math.floor(t%86400000/60000); return "Day "+d+", "+String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function repMatch(c){
  if (repFilter==="atk" && c.d) return false; if (repFilter==="def" && !c.d) return false;
  if (repFilter==="win" && (c.d ? c.r===1 : c.r!==1)) return false; if (repFilter==="loss" && (c.d ? c.r!==1 : c.r===1)) return false;
  if (repFilter==="medal" && c.m<0) return false; if (repFilter==="gear" && !c.g.some(isGearDrop)) return false;
  if (repQuery && (c.n+" "+c.c).toLowerCase().indexOf(repQuery.toLowerCase())<0) return false;
  return true;
}

function levelGuide(type){

  for (var L=1; L<=top; L++){
    var bits=[], eff=effectLine(type,L,true); if (eff) bits.push(eff);
    if (type==="townhall") bits.push("Barracks and Academy up to level "+(L+2));
    if (type==="walls" && L+2<=maxLv("townhall") && L+2>=3) bits.push("Lets the Town Hall reach level "+(L+2));
    U.forEach(function(u){ var need=u.req.filter(function(r){ return r[0]===type; })[0];
      if (need && need[1]===L){ var others=u.req.filter(function(r){ return r!==need; }); bits.push("Unlocks "+u.name+"s"+(others.length?" (also needs "+others.map(reqName).join(", ")+")":"")); } });
    for (var bt in BREQ){ if (bt===type || bt==="townhall") continue; if (BREQ[bt](1).some(function(r){ return r[0]===type && r[1]===L; })) bits.push("Lets you build "+(/^[AEIOU]/.test(DEF[bt].name)?"an ":"a ")+DEF[bt].name); }
    if (L===1){ var ts=Object.keys(TECH).filter(function(k){ return TECH[k].b===type; }).map(function(k){ return TECH[k].name; }); if (ts.length) bits.push("Opens research: "+ts.join(", ")); }
    if (type==="academy") Object.keys(TECH).forEach(function(k){ if (TECH[k].gate===L) bits.push("Unlocks "+TECH[k].name); });

function wheelSvg(){
  var cx=150, cy=150, R=138, n=WHEEL.length, seg=360/n, h='';
  function pt(a,r){ var rad=(a-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; }
  for (var i=0;i<n;i++){
    var s=WHEEL[i], a0=i*seg, a1=a0+seg, p0=pt(a0,R), p1=pt(a1,R);
    var fill = s.tier ? TIERS[s.tier].color : (i%2 ? "var(--panel2)" : "var(--panel)");
    var ink = s.tier ? TIERS[s.tier].txt : "var(--ink)";
    h+='<path d="M'+cx+' '+cy+' L'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+R+' '+R+' 0 0 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)+' Z" style="fill:'+fill+';stroke:var(--line);stroke-width:1"/>';
    var mid=a0+seg/2;
    h+='<g transform="rotate('+mid+' '+cx+' '+cy+')" style="color:'+(s.tier?ink:"var(--brass)")+'"><svg x="'+(cx-12)+'" y="26" width="24" height="24" viewBox="0 0 24 24" '+P+'>'+INNER[s.icon]+'</svg>'+
      '<text x="'+cx+'" y="68" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="12" style="fill:'+ink+'">'+s.label+'</text></g>';
  }
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" style="stroke:var(--brass)" stroke-width="6"/>';
  for (var j=0;j<n;j++){ var q=pt(j*seg,R); h+='<circle cx="'+q[0].toFixed(2)+'" cy="'+q[1].toFixed(2)+'" r="3.2" style="fill:var(--bg);stroke:var(--brass)" stroke-width="1.5"/>'; }
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="30" style="fill:var(--stone);stroke:var(--brass)" stroke-width="3"/><circle cx="'+cx+'" cy="'+cy+'" r="9" style="fill:var(--brass)"/>';
  return '<svg class="wheel" id="wheel" viewBox="0 0 300 300" style="transform:rotate('+wheelRot+'deg)" aria-hidden="true">'+h+'</svg>';
}

    '<p class="hint" style="text-align:center">Earn a quarter amulet for every finished building, research, training batch and fortification batch, 2.5 per Town Hall level, and a slow '+AMULET_PER_HOUR+' per hour.</p>'+

function updateWheelSide(){
  if (!document.getElementById("wlog")) return;
  var lg = S.wheelLog.length ? S.wheelLog.map(function(t){ return '<li>'+esc(t)+'</li>'; }).join("") : '<li>Nothing yet. Give it a spin.</li>';
  var wl=document.getElementById("wlog"); if (wl.innerHTML!==lg) wl.innerHTML=lg;
  document.getElementById("spincount").textContent = S.spins ? fmt(S.spins)+" spins so far" : "Unlimited free spins";
  var pz=document.getElementById("prize");
  var ph = lastPrize ? (lastPrize.big ? '<span class="big" style="color:'+TIERS[lastPrize.tier].color+'">'+TIERS[lastPrize.tier].name+' hero!</span>'+esc(lastPrize.txt) : 'You won <b>'+esc(lastPrize.txt)+'</b>') : '';
  if (pz.innerHTML!==ph) pz.innerHTML=ph;
  var am=Math.floor(S.amulets);
  document.getElementById("amulets").textContent = fmt(am);
  document.getElementById("amurate").textContent = "+"+AMULET_PER_HOUR+" per hour, plus a little from everything you finish";
  document.getElementById("pitybar").style.width = (S.pity/PITY*100)+"%";
  var left=PITY-S.pity;
  document.getElementById("pitytxt").textContent = "Legendary guaranteed within "+left+" spin"+(left===1?"":"s");
  var lb=document.getElementById("legendbtn");
  lb.hidden = !S.pendingLegend; lb.textContent = "Choose your legend"+(S.pendingLegend>1?" ("+S.pendingLegend+" waiting)":"");
  document.getElementById("spin1").disabled = spinning || am<1;
  document.getElementById("spin10").disabled = spinning || am<10;
  document.getElementById("spin1").textContent = am<1 ? "Need an amulet" : "Spin";
}
function doSpin(){
  if (spinning || S.amulets < 1) return;
  S.amulets -= 1;
  var roll=spinIndex(), i=roll.i, seg=360/WHEEL.length, jitter=(Math.random()-.5)*seg*0.7;
  var targetMod = (360 - (i*seg + seg/2) + jitter + 360) % 360;
  var cur = ((wheelRot % 360)+360)%360;
  var delta = (targetMod - cur + 360) % 360;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  wheelRot += (reduce?360:360*5) + delta;
  spinning = true; lastPrize=null; updateWheelSide();
  var w=document.getElementById("wheel"), dur = reduce ? 600 : 4200;
  w.style.transition = "transform "+dur+"ms cubic-bezier(.12,.72,.14,1)";
  requestAnimationFrame(function(){ w.style.transform = "rotate("+wheelRot+"deg)"; });
  setTimeout(function(){
    spinning=false; w.style.transition="none";
    lastPrize = awardPrize(i, roll.forced); S.spins++;
    save(); refresh();
    if (roll.forced) openSheet({kind:"legend"});
    else if (lastPrize.big) toast(lastPrize.txt);
  }, dur+80);
}
function doSpin10(){
  if (spinning || S.amulets < 10) return;
  S.amulets -= 10;
  var got={}, heroes=[], forcedAny=false;
  for (var n=0;n<10;n++){
    var roll=spinIndex(), i=roll.i, r=awardPrize(i, roll.forced);
    if (roll.forced) forcedAny=true;
    if (r.big) heroes.push(r); else got[WHEEL[i].label]=(got[WHEEL[i].label]||0)+1;
  }
  S.spins+=10;
  var parts = Object.keys(got).map(function(k){ return got[k]+"× "+k; });
  lastPrize = heroes.length ? {big:true,tier:heroes[heroes.length-1].tier,txt:heroes.map(function(h){return h.txt;}).join(". ")+(parts.length?". Also: "+parts.join(", "):"")} : {big:false,txt:parts.join(", ")};
  save(); refresh();
  if (forcedAny) openSheet({kind:"legend"});
}

var lastView = "";
function renderView(force){
  var v=document.getElementById("view");
  if (tab==="wheel"){
    if (force && !spinning){ v.innerHTML=viewWheel(); lastView="wheel"; }
    if (lastView!=="wheel" && !spinning){ v.innerHTML=viewWheel(); lastView="wheel"; }
    updateWheelSide(); setTabs(); return;
  }
  if (tab==="reports"){
    if (lastView!=="reports"){ v.innerHTML=viewReports(); lastView="reports"; }
    fillRepList(); setTabs(); return;
  }
  if (tab==="map"){
    if (lastView!=="map"){ v.innerHTML=viewMap(); lastView="map"; setupMapInput(); if (!mv.init){ mv.init=true; centerOn(S.map.home[0],S.map.home[1]); } mapDynamic(); }
    else if (force) mapDynamic();
    setTabs(); return;
  }
  if (tab==="war"){
    if (lastView!=="war"){ v.innerHTML=viewWar(); lastView="war"; renderSimResult(); }
    setTabs(); return;
  }
  if (v.contains(document.activeElement) && document.activeElement.tagName!=="BUTTON") return;
  if (tab==="fields") tab="city"; // fields now live under the city, not in the tab bar
  document.body.classList.toggle("bfmode", bfOn());
  var h = bfOn()?viewBattlefield():tab==="items"?viewItems():tab==="alliance"?viewAlliance():tab==="bldg"?viewBuilding():tab==="heroes"?viewHeroes():tab==="army"?viewArmy():viewCity();
  if (h===lastView && !force) return;
  lastView=h; v.innerHTML=h; setTabs(); wireDetails(v);
  if (document.getElementById("m-have")) updateMarket();
  if (tab==="army") U.forEach(function(u,i){ updateTrainRow(i); });
  if (tab==="city" || tab==="bldg") FORTS.forEach(function(f,i){ updateFortRow(i); });
}

function effectLine(type,L,only){
  var d=DEF[type], nx=L+1, top=only||L>=maxLv(type);
  if (type==="townhall") return "Level cap "+L+", "+fieldSlots(L)+" field plots"+(top?"":" → cap "+nx+", "+fieldSlots(nx)+" plots");
  if (type==="cottage") return "Houses "+fmt(tri(L)*100)+" people"+(top?"":" → "+fmt(tri(nx)*100));
  if (type==="academy") return "Research up to level "+L+(top?"":" → "+nx);
  if (type==="market") return "Trade fee "+Math.round(Math.max(0.02,0.1-0.008*L)*1000)/10+"%"+(top?"":" → "+Math.round(Math.max(0.02,0.1-0.008*nx)*1000)/10+"%");
  if (type==="walls") return "Durability "+fmt(wallDurability(L))+", "+fmt(1000*tri(L))+" fortification space"+(top?"":" → "+fmt(wallDurability(nx))+", "+fmt(1000*tri(nx)));
  if (type==="barracks") return "Trains units needing up to Barracks "+Math.min(L,MAXLV)+(L>MAXLV?", troops "+(L-MAXLV)+"% cheaper":"")+(top?"":" → "+(nx>MAXLV?"troops "+(nx-MAXLV)+"% cheaper":"Barracks "+nx));
  if (type==="stable") return "Horseback Riding up to level "+L+(top?"":" → "+nx);
  if (type==="workshop") return "Machinery and Engineering up to level "+L+(top?"":" → "+nx);
  if (type==="forge") return "Iron Working and Metal Casting up to level "+L+(top?"":" → "+nx);
  if (type==="rally") return L+" march"+(L>1?"es":"")+" at once, up to "+fmt(10000*L)+" troops each; Logistics, Compass, Privateering and Cartography up to level "+L+(top?"":" → "+nx+" marches, "+fmt(10000*nx)+" troops each");
  if (type==="embassy") return "Room for "+Math.min(10,L)+" all"+(L===1?"y":"ies")+", hosts "+fmt(L*10000)+" troops from each ally"+(top?"":" → "+Math.min(10,nx)+" allies, "+fmt(nx*10000)+" each");
  if (type==="beacon") return beaconText(L)+(top?"":" → level "+nx+": "+beaconText(nx));
  if (type==="warehouse") return "Stockpile up to level "+L+(top?"":" → "+nx);
  if (type==="feasting") return "Holds "+(4+L)+" heroes"+(top?"":" → "+(4+nx));
  if (type==="inn") return (1+Math.ceil(L/2))+" heroes for hire, up to level "+(L*3)+(top?"":" → "+(1+Math.ceil(nx/2))+", up to level "+(nx*3));
  if (d.res) return fmt(tri(L)*100)+" "+d.res+"/h, "+(20*L)+" workers"+(top?"":" → "+fmt(tri(nx)*100)+"/h, "+(20*nx)+" workers");
  return "";
}
function maxLv(type){ return cityMax(); }
var TH_OVER={barracks:2, academy:2}; // these two may be built this far above the Town Hall
function thAllows(type){ return S.th + (TH_OVER[type]||0); }
var FREE_MS=5*60000; // any building with 5 minutes or less left can be finished free
function upgradeWhy(type,L){
  if (L>=maxLv(type)) return "Max level";
  var rq=buildReqWhy(type,L+1); if (rq) return rq;
  if (type!=="townhall" && L+1>thAllows(type)) return "Needs Town Hall level "+(L+1-(TH_OVER[type]||0));
  if (!builderFree()) return "Both builders are busy";
  if (!afford(costFor(type,L+1))) return "Not enough resources";
  return "";
}

/* ---------- actions ---------- */
function startBuild(w,i,type,quiet){
  var s=getSlot(w,i), L = s ? s.level : 0, to=L+1, c=costFor(type,to);
  if (!builderFree() || buildOn(w,i) || !afford(c) || buildReqWhy(type,to)) return false;
  pay(c,1);
  if (!s){ var slot={type:type,level:0}; if (w==="in") S.inside[i]=slot; else S.fields[i]=slot; }
  S.builds.push({where:w,idx:i,type:type,to:to,start:S.gt,end:S.gt+timeFor(type,to)});
  if (!quiet) toast((to===1?"Started building a ":"Upgrading ")+DEF[type].name+(to===1?"":" to level "+to));
  return true;
}
function bqState(it){ // "go", "wait" or "drop"
  var s=getSlot(it.w,it.i);
  if (s && s.type!==it.type) return "drop";
  if (!s && DEF[it.type].unique && findUnique(it.type)) return "drop";
  var L=s?s.level:0;
  if (L>=maxLv(it.type)) return "drop";
  if (buildOn(it.w,it.i)) return "wait";
  if (it.type!=="townhall" && L+1>thAllows(it.type)) return "wait";
  if (buildReqWhy(it.type,L+1)) return "wait";
  if (!afford(costFor(it.type,L+1))) return "wait";
  return "go";
}
function uname(i,n){ var nm=U[i].name; return n===1?nm:/man$/.test(nm)?nm.replace(/man$/,"men"):nm==="Cavalry"?nm:nm==="Ballista"?"Ballistae":nm+"s"; }
function startTrain(tu,tn,slot){
  if (trainWhy(tu,tn)) return false;
  if (slot==null) slot=pickBarracks(tu);
  if (slot<0 || trainingAt(slot) || S.inside[slot].level<barracksReq(tu)) return false;
  var disc=1-0.01*Math.max(0,S.inside[slot].level-10), tc={}; for (var ck in U[tu].cost) tc[ck]=Math.ceil(U[tu].cost[ck]*tn*disc);
  pay(tc,1); S.pop -= U[tu].pop*tn;
  S.train.push({slot:slot,u:tu,n:tn,paid:tc,start:S.gt,end:S.gt+trainTime(tu)*tn});
  return true;
}
function armyCount(){ // home + training + in the field, for this city
  var c=S.troops.slice(), me=C().id;
  S.train.forEach(function(t){ c[t.u]+=t.n; });
  S.marches.forEach(function(m){ if (m.city===me) m.t.forEach(function(n,i){ c[i]+=n; }); });
  return c;
}
var AUTO_BATCH_MS=30*60000;
function goalOrder(){ var o=(S.gorder||[]).filter(function(i){ return i>=0 && i<12; }), seen={}, out=[];
  o.concat(AUTO_ORDER).forEach(function(i){ if (!seen[i]){ seen[i]=1; out.push(i); } }); return out; }
function autoTrainStep(){
  if (!S.autoTrain) return;
  var idle=barracksList().filter(function(sl){ return !trainingAt(sl); }).sort(function(a,b){ return S.inside[b].level-S.inside[a].level; });
  idle.forEach(function(slot){
    var lv=S.inside[slot].level, have=armyCount();
    var need=function(i){ var g=S.goals[i]||0, d=g-have[i]; return (g>0 && d>0 && !missing(U[i].req).length && barracksReq(i)<=lv && maxTrainAuto(i)>=1) ? d : 0; };
    var pick=-1, ord=goalOrder();
    for (var k=0;k<ord.length && pick<0;k++){ if (need(ord[k])) pick=ord[k]; }
    if (pick<0) return;
    var cap=Math.max(1, Math.floor(AUTO_BATCH_MS*S.speed/trainTime(pick))), want=Math.min(need(pick), cap), n=Math.min(want, maxTrainAuto(pick));
    // don't dribble out tiny batches as people trickle in: wait until a fifth of a batch can start, unless that finishes the goal
    if (n<want && n<Math.max(1, Math.floor(want*0.2))) return;
    startTrain(pick, n, slot);
  });
}
// why an idle Barracks isn't training, in plain words
function idleWhy(slot){
  if (!S.autoTrain) return "idle";
  var lv=S.inside[slot].level, have=armyCount(), ord=goalOrder(), shortAny=false;
  for (var k=0;k<ord.length;k++){ var i=ord[k], g=S.goals[i]||0; if (!(g>0 && have[i]<g)) continue; shortAny=true;
    if (missing(U[i].req).length || barracksReq(i)>lv) continue;
    var u=U[i];
    if (idlePop()<u.pop*Math.max(1,Math.floor(Math.min(g-have[i], Math.floor(AUTO_BATCH_MS*S.speed/trainTime(i)))*0.2))) return "idle, waiting for idle people to train "+u.name+"s";
    return "idle, short of resources for "+u.name+"s"+(Object.keys(S.reserve||{}).length?" (or held by your Warehouse reserve)":"");
  }
  return shortAny ? "idle: nothing short of its goal can train at level "+lv : "idle: every goal is met";
}
function processQueues(){
  autoTrainStep();
  for (var k=0; k<S.bq.length && builderFree(); ){
    var st=bqState(S.bq[k]);
    if (st==="drop"){ S.bq.splice(k,1); continue; }
    if (st==="go" && startBuild(S.bq[k].w,S.bq[k].i,S.bq[k].type,true)){ S.bq.splice(k,1); continue; }
    k++;
  }
  if (!S.research){
    for (var j=0;j<S.rq.length;j++){
      var tk=S.rq[j], to=(S.techG[tk]||0)+1;
      if (S.cities.some(function(c){ return c.research && c.research.tech===tk; })) continue;
      if (to>techMax()){ S.rq.splice(j,1); j--; continue; }
      if (missing(techReqs(tk,to)).length || !afford(techCost(tk,to))) continue;
      pay(techCost(tk,to),1); S.research={tech:tk,to:to,start:S.gt,end:S.gt+techTime(tk,to)}; S.rq.splice(j,1); break;
    }
  }
}
function processAll(){ var keep=S.cur; for (var ci=0; ci<S.cities.length; ci++){ S.cur=ci; processQueues(); if (typeof processAuto==="function") processAuto(); } S.cur=keep; }

    if (key==="t"||key==="f") sd[key][+ix]=val; else if (key==="r") sd.r[ix]=val; else sd[key]=val;
    if (e.target.dataset.sim==="def" && sim.def.preset!=="custom"){ sim.def.preset="custom"; var sel=document.getElementById("npcsel"); if (sel) sel.value="custom"; }
  }
});
document.addEventListener("change",function(e){
  if (e.target.dataset && e.target.dataset.bfn!=null && bfOn()){ lastSheet=""; renderSheet(); }
  if (e.target.dataset && e.target.dataset.bffavor!=null && bfOn()){ var fp=BF().p[+e.target.dataset.bffavor]; if (fp && fp.kind==="ally"){ fp.favor=e.target.value; toast(fp.name+" will favor "+e.target.options[e.target.selectedIndex].text.toLowerCase()); } }
  if (e.target.id==="m-res"){ mkt.res=e.target.value; updateMarket(); }
  if (e.target.id==="autotrain"){ S.autoTrain=e.target.checked; save(); processQueues(); lastView=""; refresh(); }
  if (e.target.id==="automayor"){ S.autoMayor=e.target.checked; save(); lastView=""; refresh(); }
  if (e.target.id==="phero"){ S.presets[sheetFor.p].hero=+e.target.value; save(); }
  if (e.target.id==="pstop"){ S.presets[sheetFor.p].stopOnLoss=e.target.checked; save(); }
  if (e.target.id==="wmis"){ waveDraft.mission=e.target.value; updateWaveInfo(); }
  if (e.target.id==="mensign"){ marchDraft.ensign=e.target.checked && (S.items.ensign||0)>0; updateMarchInfo(); }
  if (e.target.id==="marchhero"){ marchDraft.hero=+e.target.value; marchDraft.preview=""; updateMarchInfo(); }
  if (e.target.id==="npcsel"){ setPreset(e.target.value); lastView=""; renderView(true); }
});

var toastEl=document.getElementById("toast"), toastTimer;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove("show"); },3400); }

/* ---------- boot ---------- */
document.getElementById("cityname").textContent=S.name;
genMap();
applyTheme();
if (window.matchMedia){ var mq=window.matchMedia("(prefers-color-scheme: dark)"); if (mq.addEventListener) mq.addEventListener("change", function(){ applyTheme(); if (tab==="map") requestDraw(); }); }
document.getElementById("tabs").addEventListener("scroll", updateTabArrows, {passive:true});
window.addEventListener("resize", function(){ updateTabArrows(); if (tab==="map") requestDraw(); });
["orientationchange","pageshow","focus"].forEach(function(ev){ window.addEventListener(ev,function(){ if (tab==="map") setTimeout(requestDraw,60); }); });
document.addEventListener("visibilitychange",function(){ if (!document.hidden && tab==="map") setTimeout(requestDraw,60); });
if (window.visualViewport) window.visualViewport.addEventListener("resize",function(){ if (tab==="map") requestDraw(); });
document.addEventListener("scroll",function(){ if (tab==="map") requestDraw(); },{passive:true});
advance(Date.now());
if (finished.length){ toast("Finished while you were away: "+finished.slice(0,4).join(", ")+(finished.length>4?", and more":"")); finished=[]; }
refresh();

setInterval(function(){
  if (bfOn()) bfTick();
  woundExpire();
  var changed=advance(Date.now());
  if (finished.length || changed){ flushFinished(); renderQueue(); renderView(tab==="map"); renderSheet(); tickText(); save(); }
  else { tickText(); renderView(false); renderSheet(); }
  if (tab==="map" && !drag && ++mapTick%2===0) requestDraw();
},500);
setTimeout(updateTabArrows,50);
if ("serviceWorker" in navigator && location.protocol==="https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
wireDetails(document);
setInterval(save,5000);
document.addEventListener("visibilitychange",function(){ if (document.hidden){ advance(Date.now()); save(); } });
window.addEventListener("pagehide",function(){ advance(Date.now()); save(); });
})();
</script>
</body>
</html>
